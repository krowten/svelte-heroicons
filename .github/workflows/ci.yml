# Tests only. Releases are staged by release.yml on a version tag.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or PR makes the running checks moot
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Every push runs CI, so a pull request from a branch of this repository would test the same
    # commit twice; its pull_request run only goes ahead for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # a hung step would otherwise hold the runner for 6 hours
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # vite and svelte-kit run under Node, and SvelteKit 3 needs 22.17+
      - uses: actions/setup-node@v7
        with:
          node-version: 22.17
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      # the committed components must match the installed heroicons
      - run: bun run generate --check
      # builds dist and runs publint on it
      - run: bun run package

  # The Playwright image ships the browsers with their system libraries, which
  # `playwright install --with-deps` would otherwise pull through apt on every run.
  # shortcut: the image tag is bumped by hand along with playwright; a mismatch fails the browser
  # launch, bump the tag here and in release.yml
  browser:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      # setup-bun needs unzip, which the image lacks; npm brings the same binary
      - run: npm install --global bun
      - run: bun install --frozen-lockfile
      # node and browser projects; the client one runs in Chromium
      - run: bunx vitest --run
      - run: bun run test:e2e
