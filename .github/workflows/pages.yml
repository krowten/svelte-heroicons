# Builds the icon browser and deploys it to GitHub Pages.
# Needs Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # a hung step would otherwise hold the runner for 6 hours
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # vite and svelte-kit run under Node, and SvelteKit 3 needs 22.17+
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # the site is prerendered with relative paths, so it works under /<repo>/ without a base path
      - run: bun run build
        env:
          # Settings → Secrets and variables → Actions → Variables; empty means no meta tag
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
