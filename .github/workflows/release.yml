# Stages a release on npm when a `v*` tag is pushed; the maintainer then approves it on npmjs.com
# (Staged Packages) with 2FA, so nothing goes live from CI alone. Provenance ("Built and signed on
# GitHub Actions") is signed here: only a CI run of a public repository can produce it.
#
# Authentication: trusted publishing (npmjs.com → package → Settings → Trusted publishing → GitHub
# Actions, workflow release.yml, stage only). No token: npm authenticates the run through OIDC.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # signs the provenance statement, and authenticates trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # browsers and their system libraries preinstalled, see ci.yml; the image's Node 24 runs npm
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: npm install --global bun
      # No actions/setup-node: with `registry-url` it writes an `_authToken` line and a placeholder
      # NODE_AUTH_TOKEN, and npm then sends that instead of trying OIDC (E401).
      # The tag is the trigger, not the version: npm publishes whatever package.json says. Refuse
      # a mismatch instead of staging a number nobody meant.
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      # The tag may point at a commit CI never ran on, and prepublishOnly (lint, check, generated
      # files, unit tests) has no e2e.
      - run: bun run test:e2e
      # staged, not published: the release goes live only after the maintainer approves it
      - run: npm stage publish --provenance --access public
      # npm reports a failed OIDC token exchange only in its debug log, as "need auth" or E401
      - name: Show npm auth details
        if: failure()
        run: grep -hiE 'oidc|trusted|auth' /github/home/.npm/_logs/*-debug-0.log || true
